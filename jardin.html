<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para ti 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05050f;font-family:'Segoe UI',system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
#open{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:12px 26px;border-radius:999px;border:1px solid rgba(255,182,203,.6);background:rgba(255,150,185,.16);color:#ffd3e2;font-size:16px;cursor:pointer;backdrop-filter:blur(6px);box-shadow:0 0 24px rgba(255,120,170,.35);transition:background .25s,transform .25s;animation:pulse 2.6s ease-in-out infinite}
#open:hover{background:rgba(255,150,185,.3);transform:translateX(-50%) scale(1.05)}
#open:focus-visible,#close:focus-visible{outline:2px solid #ffb6cb;outline-offset:3px}
@keyframes pulse{50%{box-shadow:0 0 38px rgba(255,120,170,.65)}}
#veil{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(3,3,12,.6);backdrop-filter:blur(5px);padding:16px;box-sizing:border-box}
#veil.on{display:flex;animation:fade .4s}
@keyframes fade{from{opacity:0}}
@keyframes show{to{opacity:1}}
#card{position:relative;max-width:440px;width:100%;max-height:85%;overflow:auto;background:#fff6f1;color:#5a3340;border-radius:14px;padding:30px 30px 24px;box-sizing:border-box;box-shadow:0 10px 60px rgba(255,110,160,.4);font-family:'Caveat','Segoe Script','Brush Script MT',cursive;font-size:23px;line-height:1.35;animation:rise .6s cubic-bezier(.2,.9,.3,1.2)}
@keyframes rise{from{transform:translateY(30px) scale(.94);opacity:0}}
#card h2{margin:0 0 12px;font-size:34px;color:#d6457a;font-weight:700}
#card p{margin:0 0 10px;opacity:0}
#card .sig{text-align:right;color:#d6457a;font-weight:700}
#close{position:absolute;top:8px;right:12px;background:none;border:0;font-size:28px;color:#c9708f;cursor:pointer}
@media (prefers-reduced-motion:reduce){#open{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="open">💌 Abrir cartita</button>

<div id="veil" role="dialog" aria-modal="true" aria-label="Carta">
  <div id="card">
    <button id="close" aria-label="Cerrar">×</button>
    <!-- ✏️ EDITA AQUÍ TU CARTA: cambia el título, los párrafos y la firma -->
    <h2>Para ti, mi amor 🌸</h2>
    <p>Quería regalarte un jardín que nunca se marchita, aunque esté hecho de píxeles.</p>
    <p>Gracias por hacerme reír, por escucharme y por ser mi lugar favorito en el mundo.</p>
    <p>Cada flor de aquí es un momento contigo. Y todavía nos faltan muchos por sembrar.</p>
    <p class="sig">Siempre tuyo,<br>Hugo 💗</p>
  </div>
</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const R=(a,b)=>a+Math.random()*(b-a), TAU=Math.PI*2;
let W,H,S,bx,by,t=0,stars=[],grass=[],leaves=[],flies=[],hearts=[];

// dx/dy: posición de la flor respecto a la base; c: curvatura del tallo
const FL=[
  {dx:-8,dy:-330,c:14,k:1,ph:0},
  {dx:-115,dy:-235,c:-70,k:1,ph:1.3},
  {dx:4,dy:-245,c:-16,k:.95,ph:2.1},
  {dx:85,dy:-265,c:55,k:1,ph:3.4}
];

function size(){
  const d=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
  S=Math.min(H/580,W/700);bx=W/2;by=H+4;build();
}

function build(){
  stars=Array.from({length:Math.round(W*H/5000)},()=>({x:R(0,W),y:R(0,H),r:R(.4,1.4),p:R(0,TAU),s:R(.5,2)}));
  grass=Array.from({length:110},()=>{
    const g=(Math.random()+Math.random()+Math.random()-1.5)/1.5;
    return{x:bx+g*W*.3,h:R(50,300)*S*(1-Math.abs(g)*.35),w:R(3,9)*S,l:R(-.5,.5)*R(.3,1)+g*.3,
      p:R(0,TAU),sp:R(.6,1.4),hue:R(118,145),li:R(20,44),back:Math.random()<.45};
  }).sort((a,b)=>b.back-a.back);
  leaves=Array.from({length:55},()=>({x:bx+R(-170,170)*S,y:by-R(0,130)*S,r:R(18,48)*S,a:R(-3.1,3.1),p:R(0,TAU),li:R(10,28)}));
  flies=Array.from({length:34},()=>({x:bx+R(-.45,.45)*W,y:R(H*.1,H*.9),vx:R(-8,8),vy:R(-8,8),p:R(0,TAU),sp:R(.8,2.4),r:R(1.2,2.4),c:Math.random()<.75?'255,226,90':'120,255,150'}));
}

const q=(a,b,c,u)=>{const v=1-u;return[v*v*a[0]+2*v*u*b[0]+u*u*c[0],v*v*a[1]+2*v*u*b[1]+u*u*c[1]]};
function stem(f){
  const hx=Math.sin(t*.8+f.ph)*9*S;
  return[[bx+f.dx*S*.1,by],[bx+(f.dx*.35+f.c)*S+hx*.3,by+f.dy*S*.55],[bx+f.dx*S+hx,by+f.dy*S+Math.sin(t*1.1+f.ph)*3*S]];
}
function leaf(L,Wd){ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(L*.5,-Wd,L,0);ctx.quadraticCurveTo(L*.5,Wd,0,0);ctx.fill()}

function blade(b){
  const sw=Math.sin(t*b.sp+b.p)*.12+Math.sin(t*.4+b.x*.01)*.06, o=b.l+sw;
  const tx=b.x+o*b.h*.6, ty=by-b.h*(1-Math.abs(o)*.15), cx=b.x+o*b.h*.1, cy=by-b.h*.55;
  ctx.fillStyle=`hsl(${b.hue} 72% ${b.back?b.li*.6:b.li}%)`;
  ctx.beginPath();ctx.moveTo(b.x-b.w/2,by);ctx.quadraticCurveTo(cx-b.w/3,cy,tx,ty);ctx.quadraticCurveTo(cx+b.w/3,cy,b.x+b.w/2,by);ctx.fill();
}

function flower(x,y,k,tilt,ph){
  ctx.save();ctx.translate(x,y);ctx.rotate(tilt);ctx.scale(k,k);
  const g=ctx.createLinearGradient(0,0,44,0);
  g.addColorStop(0,'#f29bb8');g.addColorStop(.6,'#fbc3d6');g.addColorStop(1,'#ffeef3');
  ctx.fillStyle=g;ctx.shadowColor='rgba(255,170,200,.55)';ctx.shadowBlur=16;
  [-168,-128,-90,-52,-12].forEach((d,i)=>{
    ctx.save();ctx.rotate(d*Math.PI/180+Math.sin(t*1.4+i+ph)*.035);
    ctx.beginPath();ctx.ellipse(22,0,22,i%2?13:16,0,0,TAU);ctx.fill();ctx.restore();
  });
  ctx.shadowBlur=0;
  ctx.fillStyle='#fff4f7';ctx.beginPath();ctx.ellipse(0,1,17,7,0,0,TAU);ctx.fill();
  ctx.fillStyle='#ffc53d';ctx.beginPath();ctx.ellipse(0,0,12,4.5,0,0,TAU);ctx.fill();
  ctx.fillStyle='#fff0a0';
  for(let i=-2;i<=2;i++){ctx.beginPath();ctx.arc(i*4,-3-Math.abs(i),1.4,0,TAU);ctx.fill()}
  ctx.restore();
}

function heartPath(x,y,s){
  const h=s/2;ctx.beginPath();ctx.moveTo(x,y+h*.9);
  ctx.bezierCurveTo(x-h*1.6,y-h*.1,x-h*.8,y-h*1.4,x,y-h*.5);
  ctx.bezierCurveTo(x+h*.8,y-h*1.4,x+h*1.6,y-h*.1,x,y+h*.9);ctx.fill();
}
function addHeart(x,y,burst,age){
  hearts.push({x,y,s:R(9,34)*(S>.6?1:.8),vy:R(14,34)*(burst?2:1),ph:R(0,TAU),age:age||0,life:R(6,10),
    ring:burst||Math.random()<.65,rw:R(1,4),dim:!burst&&Math.random()<.3,col:Math.random()<.2?'#ff6f9f':'#ff9fba'});
}

let last=0,nextH=0;
function frame(ms){
  const dt=Math.min((ms-last)/1000||0,.05);last=ms;t=ms/1000;
  // fondo
  let g=ctx.createRadialGradient(W/2,H*.35,0,W/2,H*.5,Math.max(W,H)*.75);
  g.addColorStop(0,'#1a1626');g.addColorStop(1,'#04040e');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{ctx.fillStyle=`rgba(255,255,255,${.15+.35*Math.abs(Math.sin(t*s.s+s.p))})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fill()});
  // resplandor central
  const gr=(260+Math.sin(t*.9)*14)*S;
  g=ctx.createRadialGradient(bx,by-270*S,0,bx,by-270*S,gr);
  g.addColorStop(0,'rgba(255,205,225,.24)');g.addColorStop(1,'rgba(255,205,225,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // pasto de atrás
  grass.filter(b=>b.back).forEach(blade);
  // tallos y hojas
  FL.forEach(f=>{
    const [a,b,c]=stem(f);
    ctx.strokeStyle='#1b7f3e';ctx.lineWidth=6*S;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(...a);ctx.quadraticCurveTo(...b,...c);ctx.stroke();
    [.3,.5,.7].forEach((u,i)=>{
      const [x,y]=q(a,b,c,u),side=i%2?1:-1;
      ctx.save();ctx.translate(x,y);ctx.rotate(-Math.PI/2+side*(.95+Math.sin(t+i+f.ph)*.06));
      ctx.fillStyle='#22a04d';leaf(34*S*(1-u*.3),11*S);ctx.restore();
    });
  });
  // flores
  FL.forEach(f=>{
    const [,b,c]=stem(f), tilt=(Math.atan2(c[1]-b[1],c[0]-b[0])+Math.PI/2)*.6;
    flower(c[0],c[1],f.k*S*1.05,tilt,f.ph);
  });
  // arbusto y pasto de adelante
  leaves.forEach(l=>{
    ctx.save();ctx.translate(l.x,l.y);ctx.rotate(l.a+Math.sin(t*.6+l.p)*.05);
    ctx.fillStyle=`hsl(145 65% ${l.li}%)`;ctx.beginPath();ctx.ellipse(0,0,l.r,l.r*.6,0,0,TAU);ctx.fill();ctx.restore();
  });
  grass.filter(b=>!b.back).forEach(blade);
  // luciérnagas
  flies.forEach(f=>{
    f.x+=(f.vx+Math.sin(t*.7+f.p)*8)*dt;f.y+=(f.vy+Math.cos(t*.6+f.p)*8)*dt;
    if(f.x<-20)f.x=W+20;if(f.x>W+20)f.x=-20;if(f.y<-20)f.y=H;if(f.y>H+20)f.y=-20;
    const a=.4+.6*Math.abs(Math.sin(t*f.sp+f.p));
    const gg=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r*5);
    gg.addColorStop(0,`rgba(${f.c},${a})`);gg.addColorStop(1,`rgba(${f.c},0)`);
    ctx.fillStyle=gg;ctx.beginPath();ctx.arc(f.x,f.y,f.r*5,0,TAU);ctx.fill();
    ctx.fillStyle=`rgba(255,250,200,${a})`;ctx.beginPath();ctx.arc(f.x,f.y,f.r*.7,0,TAU);ctx.fill();
  });
  // corazones
  if(t>nextH){addHeart(R(.05,.95)*W,R(.45,1)*H);nextH=t+R(.6,1.2)}
  hearts=hearts.filter(h=>h.age<h.life);
  hearts.forEach(h=>{
    h.age+=dt;h.y-=h.vy*dt;h.x+=Math.sin(h.age*.8+h.ph)*12*dt;
    const al=Math.pow(Math.sin(Math.PI*h.age/h.life),.8)*(h.dim?.25:.95);
    ctx.globalAlpha=al;ctx.fillStyle=h.col;heartPath(h.x,h.y,h.s);
    if(h.ring){ctx.globalAlpha=al*.8;ctx.strokeStyle='#ffb3c8';ctx.lineWidth=h.rw;ctx.beginPath();ctx.arc(h.x,h.y,h.s*1.55,0,TAU);ctx.stroke()}
    ctx.globalAlpha=1;
  });
  requestAnimationFrame(frame);
}

// interacción: toca el jardín y salen corazones
cv.addEventListener('pointerdown',e=>{for(let i=0;i<3;i++)addHeart(e.clientX+R(-20,20),e.clientY+R(-10,20),true)});

// cartita
const veil=document.getElementById('veil'),card=document.getElementById('card');
function openLetter(){
  veil.classList.add('on');
  card.querySelectorAll('p').forEach((p,i)=>{p.style.animation='none';void p.offsetWidth;p.style.animation=`show .8s ${.5+i*.9}s forwards`});
  for(let i=0;i<12;i++)addHeart(W/2+R(-150,150),H*.92,true);
  document.getElementById('close').focus();
}
function closeLetter(){veil.classList.remove('on')}
document.getElementById('open').onclick=openLetter;
document.getElementById('close').onclick=closeLetter;
veil.addEventListener('click',e=>{if(e.target===veil)closeLetter()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeLetter()});

addEventListener('resize',size);
size();
for(let i=0;i<8;i++)addHeart(R(.05,.95)*W,R(.3,1)*H,false,R(0,4));
requestAnimationFrame(frame);
</script>
</body>
</html>
